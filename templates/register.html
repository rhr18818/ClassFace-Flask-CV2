{% extends "base.html" %}
{% block title %}Register New Student{% endblock %}
{% block content %}
  <h2 class="text-center mb-4">Register New Student</h2>

  <div class="row justify-content-center mb-3">
    <div class="col-md-4">
      <label for="idInput" class="form-label">Student ID</label>
      <input type="text" id="idInput" class="form-control" placeholder="e.g. 2023-0456">
    </div>
    <div class="col-md-4">
      <label for="nameInput" class="form-label">Student Name</label>
      <input type="text" id="nameInput" class="form-control" placeholder="Enter full name…">
    </div>
  </div>

  <div class="d-flex flex-column align-items-center">
    <video
      id="video"
      autoplay
      playsinline
      style="width:640px; height:480px; object-fit: cover; border:1px solid #ccc; border-radius:8px;"
    ></video>

    <button
      id="btnRegister"
      class="btn btn-primary mt-3 px-4"
    >
      Capture &amp; Register
    </button>

    <div id="msg" class="mt-3 w-50 text-center"></div>
  </div>

  <script>
    const video     = document.getElementById('video');
    const msg       = document.getElementById('msg');
    const btn       = document.getElementById('btnRegister');
    const idInput   = document.getElementById('idInput');
    const nameInput = document.getElementById('nameInput');

    // Start webcam
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => video.srcObject = stream)
      .catch(err => {
        msg.innerHTML = `<div class="alert alert-danger">Webcam error: ${err}</div>`;
        btn.disabled = true;
      });

    btn.onclick = async () => {
      const studentId   = idInput.value.trim();
      const studentName = nameInput.value.trim();
      if (!studentId || !studentName) {
        msg.innerHTML = `<div class="alert alert-warning">Please enter both ID and Name.</div>`;
        return;
      }

      // capture frame
      const canvas = document.createElement('canvas');
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const dataURL = canvas.toDataURL('image/jpeg');

      // send to backend
      const resp = await fetch('/register/submit', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          id: studentId,
          name: studentName,
          image: dataURL
        })
      });
      const result = await resp.json();
      if (result.status === 'success') {
        msg.innerHTML = `<div class="alert alert-success">${result.message}</div>`;
      } else {
        msg.innerHTML = `<div class="alert alert-danger">${result.message}</div>`;
      }
    };
  </script>
{% endblock %}
